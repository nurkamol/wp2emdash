# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds (pnpm >=10.26 / 11) passes.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

# Supply-chain hardening: cooldown on brand-new releases (EmDash exempt)
# and no non-registry transitive sources. (No trustPolicy: no-downgrade --
# it trips on upstream provenance regressions we don't control.)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
blockExoticSubdeps: true

# Versions the kit verified together (src/phases/scaffold.ts STACK). @astrojs/cloudflare asks for
# @cloudflare/vite-plugin with a caret range; a newer plugin can require a newer Wrangler than the pinned one
# (1.70.1 needs wrangler ^4.164.0 — found by the WordPress end-to-end test, 2026-11-22). A project without a
# lockfile would pick it up and fail to build, so the plugin is pinned to the version the sites run on.
overrides:
  "@cloudflare/vite-plugin": 1.70.0
