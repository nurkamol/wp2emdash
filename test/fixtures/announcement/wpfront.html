<!doctype html>
<html lang="en">
<head>
<title>Fixture Studio</title>
<style type="text/css">
	#wpfront-notification-bar, #wpfront-notification-bar-editor { background: #1d3557; background: -moz-linear-gradient(top, #1d3557 0%, #0b1a2c 100%); background: linear-gradient(to bottom, #1d3557 0%, #0b1a2c 100%); }
	#wpfront-notification-bar div.wpfront-message, #wpfront-notification-bar-editor li, #wpfront-notification-bar-editor p { color: #ffffff; }
	#wpfront-notification-bar a.wpfront-button, #wpfront-notification-bar-editor a.wpfront-button { background: #e63946; background: linear-gradient(to bottom, #e63946 0%, #b72a35 100%); color: #ffffff; }
	#wpfront-notification-bar div.wpfront-close { border: 1px solid #555555; background-color: #555555; color: #000000; }
</style>
</head>
<body>
<div id="wpfront-notification-bar-spacer" class="wpfront-notification-bar-spacer wpfront-fixed-position hidden">
	<div id="wpfront-notification-bar-open-button" aria-label="reopen" role="button" class="wpfront-notification-bar-open-button hidden top wpfront-bottom-shadow"></div>
	<div id="wpfront-notification-bar" class="wpfront-notification-bar wpfront-fixed top wpfront-bottom-shadow">
		<div aria-label="close" class="wpfront-close">X</div>
		<table border="0" cellspacing="0" cellpadding="0" role="presentation">
			<tr><td>
				<div class="wpfront-message wpfront-div">Spring sale: <em>20% off</em> all memberships this week.</div>
				<div class="wpfront-div"><a class="wpfront-button" href="https://fixture.example/memberships/" target="_blank" rel="noopener">See memberships</a></div>
			</td></tr>
		</table>
	</div>
</div>
<header class="site-header"><a href="/">Fixture Studio</a></header>
<main><h1>Welcome</h1><p>Classes every day.</p></main>
</body>
</html>
